# Course scope: regression, decision trees, bagging and boosting only.
seed: 42
protocol: artist_disjoint_partition
features: [tempo, loudness, duration, artist_score]
cv:
  outer_folds: 5
  inner_folds: 5
  selection_metric: accuracy
  n_jobs: 1
threshold_tie_policy: closest_to_0.5_then_lower
family_order: [logistic_regression, polynomial_logistic, decision_tree, bagged_trees, random_forest, adaboost, gradient_boosting]
models:
  logistic_regression:
    fixed: {solver: lbfgs, l1_ratio: 0.0, max_iter: 5000, tol: 0.000001}
    grid: {model__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]}
  polynomial_logistic:
    fixed: {solver: lbfgs, l1_ratio: 0.0, max_iter: 10000, tol: 0.000001}
    grid: {polynomial__degree: [2], model__C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]}
  decision_tree:
    fixed: {}
    grid:
      model__max_depth: [2, 4, 6, 8, 12, null]
      model__min_samples_leaf: [5, 10, 20, 40]
      model__ccp_alpha: [0.0, 0.001, 0.005]
    max_candidates: 18
    anchors:
      - {model__max_depth: 8, model__min_samples_leaf: 20, model__ccp_alpha: 0.0}
      - {model__max_depth: 2, model__min_samples_leaf: 20, model__ccp_alpha: 0.0}
  bagged_trees:
    fixed: {n_estimators: 150, bootstrap: true, n_jobs: 1}
    base_tree: {min_samples_leaf: 10}
    grid:
      model__estimator__max_depth: [3, 6, null]
      model__estimator__min_samples_leaf: [5, 20]
      model__max_samples: [0.7, 1.0]
    max_candidates: 8
  random_forest:
    fixed: {n_estimators: 300, n_jobs: 1}
    grid:
      model__max_depth: [4, 6, 10, null]
      model__min_samples_leaf: [2, 5, 10, 30]
      model__max_features: [sqrt, 1.0]
      model__max_samples: [0.7, 1.0]
    max_candidates: 12
    anchors:
      - {model__max_depth: 4, model__min_samples_leaf: 5, model__max_features: sqrt, model__max_samples: 1.0}
  adaboost:
    fixed: {}
    base_tree: {max_depth: 1, min_samples_leaf: 10}
    grid:
      model__n_estimators: [50, 150]
      model__learning_rate: [0.03, 0.1, 0.5]
      model__estimator__max_depth: [1, 2]
    max_candidates: 8
  gradient_boosting:
    fixed: {n_iter_no_change: null}
    grid:
      model__n_estimators: [100, 200]
      model__learning_rate: [0.03, 0.1]
      model__max_depth: [1, 2, 3]
      model__min_samples_leaf: [10, 30]
      model__subsample: [0.7, 1.0]
    max_candidates: 12
