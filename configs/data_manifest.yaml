# Generated source facts are written to data/raw/MANIFEST.csv by the acquisition
# commands.  Keep this file under version control for the reproducible choices.
dataset_version: u1-mode-b-v1
reproduction_mode: B
date_window: ["1990-01-01", "2018-12-31"]
seed: 42
normalization: "NFKC/casefold/whitespace/punctuation; original text retained"
balancing: "deduplicate and remove hit overlaps before deterministic 1:1 sampling"
artist_score: "prior Billboard event only; evidence date must be earlier than row reference_date"
feature_policy: "Mode B: MSD-native tempo, loudness and duration. No Spotify feature collection."
